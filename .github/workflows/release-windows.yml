name: Signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  build-signed-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Require code-signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or
              [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD repository secrets are required.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test
          npm run test:database

      - name: Build signed installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:signed

      - name: Verify Electron fuses
        run: npm run verify:fuses -- "release/win-unpacked/Sport Coach Mesh.exe"

      - name: Verify packaged contents
        run: npm run verify:package -- "release/win-unpacked/resources/app.asar"

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter '*.exe' -File |
            Where-Object Name -Like '*Setup*' |
            Select-Object -First 1
          if (-not $installer) { throw 'The Windows installer was not produced.' }
          ./scripts/verifyWindowsSignature.ps1 `
            'release/win-unpacked/Sport Coach Mesh.exe' `
            $installer.FullName

      - name: Upload signed installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sport-coach-mesh-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
