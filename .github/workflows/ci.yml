name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The analysis pipeline + tests are renderer-only and have no native
      # dependencies; skip the better-sqlite3 native build (not needed for
      # typecheck or the unit tests, and it keeps CI fast and hermetic).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production bundles
        run: npm run build

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundles
        run: npm run build

      - name: Test native database recovery
        run: npm run test:database

      - name: Package Windows application
        run: npx electron-builder --win --dir --publish never

      - name: Verify Electron fuses
        run: npm run verify:fuses -- "release/win-unpacked/Sport Coach Mesh.exe"

      - name: Verify packaged contents
        run: npm run verify:package -- "release/win-unpacked/resources/app.asar"
